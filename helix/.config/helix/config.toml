theme = "catppuccin_mocha"

[editor]
line-number = "relative"
mouse = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.statusline]
left = ["mode", "spinner", "read-only-indicator"]
center = ["file-name"] 
right = ["diagnostics", "selections","register","position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.lsp]
display-inlay-hints = true
display-progress-messages = true

[editor.auto-save]
focus-lost = true
after-delay.enable = true

[keys.normal]
# lazy git
A-g = [":new", ":insert-output lazygit", ":buffer-close!", ":redraw"]
# gitui (written in rust)
C-g = [
    ":write-all",
    ":new",
    ":insert-output gitui >/dev/tty",
    ":buffer-close!",
    ":redraw",
    ":reload-all"
]
# Compile and run using make
C-r = [
    ":write-all",
    ":new",
    ":insert-output make run > /dev/tty",
    ":buffer-close!",
    ":redraw",
    ":reload-all"
]

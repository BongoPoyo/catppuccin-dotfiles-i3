# Globals
set -g default-shell /usr/bin/fish
set -g default-terminal "tmux-256color"
set -g set-clipboard on
set -g mouse on
set -g history-limit 10000
set -g focus-events on
set -g escape-time 0
set -as terminal-features ",*:RGB"

# prefix key
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; \
    display-message "tmux config reloaded"
    
# Window controls
bind c new-window -c "#{pane_current_path}"
bind -n S-Left previous-window
bind -n S-Right next-window

bind -n M-1 select-window -t 1 # m = mod -> alt
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Split windows (panes :3)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# no prefix switch panes
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

# no prefix swap panes (no work :( )
bind -n S-Left  select-pane -m \; \
                select-pane -L \; \
                swap-pane -d \; \
                select-pane -M

bind -n S-Down  select-pane -m \; \
                select-pane -D \; \
                swap-pane -d \; \
                select-pane -M

bind -n S-Up    select-pane -m \; \
                select-pane -U \; \
                swap-pane -d \; \
                select-pane -M
                
bind -n S-Right select-pane -m \; \
                select-pane -R \; \
                swap-pane -d \; \
                select-pane -M

# no prefix resize
bind -n M-Left resize-pane -L
bind -n M-Right resize-pane -R
bind -n M-Up resize-pane -U
bind -n M-Down resize-pane -D

# pane controls
bind -n C-f resize-pane -Z # fullscreen=
bind -n C-q kill-pane
bind -n C-t display-popup -E -w 80% -h 80% \
    -d "#{pane_current_path}" # floating terminal
bind -n C-S-q kill-server




# VIM COPY PASTE
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on



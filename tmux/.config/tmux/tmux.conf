# Globals
set -g default-shell /usr/bin/fish
set -g default-terminal "tmux-256color"
set -g set-clipboard on
set -g mouse on
set -g history-limit 10000
set -g focus-events on
set -g escape-time 0
set -as terminal-features ",*:RGB"

# prefix key
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; \
    display-message "tmux config reloaded"
    
# Window controls
bind c new-window -c "#{pane_current_path}"
bind -n S-Left previous-window
bind -n S-Right next-window

bind -n M-1 select-window -t 1 # m = mod -> alt
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Split windows (panes :3)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# no prefix switch panes
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

# no prefix move panes (no work :( )
bind -n C-S-Left  swap-pane -s '{left-of}'
bind -n C-S-Right swap-pane -s '{right-of}'
bind -n C-S-Up    swap-pane -s '{up-of}'
bind -n C-S-Down  swap-pane -s '{down-of}'


# pane controls
bind -n C-f resize-pane -Z # fullscreen=
bind -n C-q kill-pane
bind -n C-t display-popup -E -w 80% -h 80% \
    -d "#{pane_current_path}" # floating terminal
bind -n C-S-q kill-server




# VIM COPY PASTE
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on


# colors :O
thm_rosewater="#f6e0dc"
thm_flamingo="#f2cdcd"
thm_pink="#f5c2e7"
thm_mauve="#cba6f7"
thm_red="#f38ba8"
thm_maroon="#eba0ac"
thm_peach="#fab387"
thm_yellow="#f9e2af"
thm_green="#a6e3a1"
thm_teal="#94e2d5"
thm_sky="#89dceb"
thm_sapphire="#74c7ec"
thm_blue="#89b4fa"
thm_lavender="#b4befe"
thm_text="#cdd6f4"
thm_subtext1="#bac2de"
thm_subtext0="#a6adc8"
thm_overlay2="#9399b2"
thm_overlay1="#7f849c"
thm_overlay0="#6c7086"
thm_surface2="#585b70"
thm_surface1="#45475a"
thm_surface0="#313244"
thm_base="#1e1e2e"
thm_mantle="#181825"
thm_crust="#11111b"


# status bar
set -g status-position top
set -g status-bg "${thm_crust}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status "on"
set -g status-interval 2

# Messages
set -g message-style "fg=${thm_pink},bg=${thm_crust},align=centre"
set -g message-command-style "fg=${thm_pink},bg=${thm_crust},align=centre"

# pane border settings
set -g pane-border-style "fg=${thm_surface0}"
set -g pane-active-border-style "fg=${thm_pink}"

# windows
set -g window-status-activity-style "fg=${thm_text},bg=${thm_crust},none"
set -g window-status-seperator ""
set -g window-status-style "fg=${thm_text},bg=${thm_crust},none"

# Statusline - current window
set -g window-status-current-format "#[fg=${thm_pink},bg=${thm_crust}] #I: #[fg=${thm_mauve},bg=${thm_crust}](✓) #[fg=${thm_pink},bg=${thm_crust}]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${thm_mauve},bg=${thm_bg}]"

# Statusline - other windows (non active)
set -g window-status-format "#[fg=${thm_blue},bg=${thm_crust}] #I: #[fg=${thm_text},bg=${thm_crust}]#W"

# Statusline - right side
set -g status-right "#[fg=${thm_pink},bg=${thm_crust},nobold,nounderscore,noitalics]#[fg=${thm_crust},bg=${thm_pink},nobold,nounderscore,noitalics] #[fg=${thm_text},bg=${thm_surface0}] #W #{?client_prefix,#[fg=${thm_mauve}],#[fg=${thm_pink}]}#[bg=${thm_surface0}]#{?client_prefix,#[bg=${thm_mauve}],#[bg=${thm_pink}]}#[fg=${thm_crust}] #[fg=${thm_text},bg=${thm_surface0}] #S "

# Statusline - left side (empty)
set -g status-left ""

# Modes
set -g clock-mode-colour "${thm_pink}"
set -g mode-style "fg=${thm_pink},bg=${thm_crust},bold"
